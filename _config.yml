# Site settings — fill in as decisions get made in later phases
title: "Ordinary History"
description: "A building historian's deep dives into the fabric of old buildings and the people who lived in them."
url: "https://www.ordinaryhistory.com"
baseurl: ""

theme: minima
markdown: kramdown
permalink: /:categories/:title/

# Silences Sass deprecation warnings from minima's bundled styles (not our
# own code) — minima 2.5.2 is the latest release and still uses old Sass
# syntax; revisit if/when the theme is replaced or customized in phase 4.
sass:
  quiet_deps: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Phase 2 data model. Cross-linking uses front-matter references (e.g.
# related_people: [tom-doe]) resolved by slug — see _includes/related-people.html.
# Buildings and changes attach to a building via a `building: <slug>` field,
# resolved the same way — see _includes/building-link.html and building-section.html.
collections:
  people:
    output: true
    permalink: /people/:path/
  buildings:
    output: true
    permalink: /buildings/:path/
  changes:
    output: true
    permalink: /changes/:path/

# Pins nav order/scope instead of falling back to site.pages glob order.
# "Home" is deliberately omitted — minima's header already links the site
# title back to `/`.
header_pages:
  - buildings.md
  - people.md
  - posts.md
  - changes.md

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
