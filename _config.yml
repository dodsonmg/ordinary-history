# Site settings — fill in as decisions get made in later phases
title: "Ordinary History"
description: "A history of the people who lived here, roughly 1700s to present."
url: "https://www.ordinaryhistory.com"
baseurl: ""

theme: minima
markdown: kramdown
permalink: /:categories/:title/

# Silences Sass deprecation warnings from minima's bundled styles (not our
# own code) — minima 2.5.2 is the latest release and still uses old Sass
# syntax; revisit if/when the theme is replaced or customized in phase 4.
sass:
  quiet_deps: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Phase 2 data model. Cross-linking uses front-matter references (e.g.
# related_people: [tom-doe]) resolved by slug — see _includes/related-people.html.
# _places/_events can be added the same way later if the content calls for it.
collections:
  people:
    output: true
    permalink: /people/:path/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
