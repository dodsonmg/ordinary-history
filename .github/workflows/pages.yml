name: Build and deploy Jekyll site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - name: Build all sites with Jekyll
        # bin/build runs one `jekyll build` per site (portfolio + each
        # building) into a combined _site/ — see bin/build for why a single
        # `jekyll build` can't do this alone. The "/ordinary-history" prefix
        # is temporary: _config.yml's baseurl "" is correct for the eventual
        # custom domain (serves at root, phase 7 of the plan), but the
        # interim github.io/ordinary-history/ URL needs every link prefixed.
        # Drop this argument once the custom domain is live.
        run: bin/build /ordinary-history
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
